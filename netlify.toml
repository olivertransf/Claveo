[build]
  publish = "."
  command = "echo 'No build needed'"

# Handle admin routes first (order matters - more specific routes first)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Redirect all other requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


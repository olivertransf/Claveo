backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "index"
        file: "index.html"
        format: "html"
        editor:
          preview: false
        fields:
          - {label: "HTML Content", name: "body", widget: "code", default_language: "html"}

backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "index"
        file: "index.html"
        editor:
          preview: false
        fields:
          - label: "HTML File Content"
            name: "body"
            widget: "code"
            default_language: "html"
            allow_language_selection: false
